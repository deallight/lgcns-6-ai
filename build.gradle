plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.miniproject1'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 1. REST API와 요청값 검증
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 2. MariaDB 연결
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// 3. Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// 4. PDF 텍스트 파싱
	implementation('org.apache.pdfbox:pdfbox:3.0.8') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}

	// 5. HWP 텍스트 파싱
	implementation 'kr.dogfoot:hwplib:1.1.11'

	// 6. OpenAI 공고문 요약
	implementation 'com.openai:openai-java:4.69.3'

	// 7. 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 로컬 실행 시 .env에서 AI 서버에 필요한 값만 불러옵니다.
tasks.named('bootRun') {
	def allowedKeys = ['DB_URL', 'DB_USER', 'DB_PASSWORD', 'OPEN_AI_KEY', 'OPEN_AI_MODEL']
	def envFile = file('.env')

	if (envFile.exists()) {
		envFile.eachLine { line ->
			def separator = line.indexOf('=')
			if (separator > 0) {
				def key = line.substring(0, separator).trim()
				def value = line.substring(separator + 1).trim()

				if (allowedKeys.contains(key)) {
					environment key, value.replaceAll(/^['\"]|['\"]$/, '')
				}
			}
		}
	}
}
